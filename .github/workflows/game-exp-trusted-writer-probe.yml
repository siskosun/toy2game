name: game-exp trusted writer probe

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Probe request id
        required: true
        type: string

permissions:
  contents: write

jobs:
  write-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ledger
        uses: actions/checkout@v6
        with:
          ref: game-exp/ledger
          fetch-depth: 0
          persist-credentials: true
      - name: Append trusted probe
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p operations
          printf '{"request_id":"%s","producer":"github-actions","run_id":"%s","run_attempt":"%s"}\n'             "$REQUEST_ID" "$RUN_ID" "$RUN_ATTEMPT" > "operations/${REQUEST_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "operations/${REQUEST_ID}.json"
          git commit -m "game-exp trusted probe ${REQUEST_ID}"
          git push origin HEAD:game-exp/ledger
