name: game-exp source initializer
run-name: game-exp:initialize:${{ inputs.request_id }}

concurrency:
  group: game-exp-initialize-${{ inputs.request_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: Canonical experiment id, e.g. EXP-21
        required: true
        type: string
      request_id:
        description: Stable cross-interface operation id
        required: true
        type: string

permissions:
  contents: read

jobs:
  dedupe:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      primary: ${{ steps.guard.outputs.primary }}
      primary_run_id: ${{ steps.guard.outputs.primary_run_id }}
      actor_login: ${{ steps.guard.outputs.actor_login }}
    steps:
      - name: Checkout request-id guard
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: control-guard
          sparse-checkout: |
            tools/game-exp/workflow_guard.py
            tools/game-exp/protocol_core.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select the first run for this request id
        id: guard
        env:
          GAME_EXP_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python control-guard/tools/game-exp/workflow_guard.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "game-exp-source-initializer.yml" \
            --action "initialize" \
            --request-id "${{ inputs.request_id }}" \
            --run-id "${{ github.run_id }}" \
            --experiment-id "${{ inputs.experiment_id }}" \
            --github-output "$GITHUB_OUTPUT"

  initialize-source:
    needs: dedupe
    if: needs.dedupe.outputs.primary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted control source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: control
          sparse-checkout: |
            tools/game-exp/source_initializer.py
            tools/game-exp/protocol_core.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Require trusted source-writer key
        shell: bash
        env:
          WRITER_KEY: ${{ secrets.GAME_EXP_WRITER_KEY }}
        run: |
          set -euo pipefail
          test -n "$WRITER_KEY"
          key="$RUNNER_TEMP/game-exp-writer"
          printf '%s\n' "$WRITER_KEY" > "$key"
          chmod 600 "$key"
          echo "GAME_EXP_WRITER_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Initialize canonical source refs
        id: init
        shell: bash
        env:
          GAME_EXP_GITHUB_TOKEN: ${{ github.token }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
        run: |
          set -euo pipefail
          set +e
          python control/tools/game-exp/source_initializer.py \
            --repo "$GITHUB_REPOSITORY" \
            --experiment-id "$EXPERIMENT_ID" \
            --ssh-key "$GAME_EXP_WRITER_KEY_PATH" \
            | tee "$RUNNER_TEMP/game-exp-init-result.json"
          code=${PIPESTATUS[0]}
          set -e

          python - "$RUNNER_TEMP/game-exp-init-result.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          result=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()[-1])
          with open(sys.argv[2],"a",encoding="utf-8") as out:
              out.write(f"result={result.get('status','UNKNOWN')}\n")
              out.write(f"branch_head={result.get('branch_head','')}\n")
              out.write(f"initialization_commit={result.get('initialization_commit','')}\n")
              out.write(f"replayed={str(result.get('replayed',False)).lower()}\n")
          PY
          exit "$code"

      - name: Report result
        if: always()
        shell: bash
        run: |
          echo "result=${{ steps.init.outputs.result }}"
          echo "branch_head=${{ steps.init.outputs.branch_head }}"
          echo "initialization_commit=${{ steps.init.outputs.initialization_commit }}"
          echo "replayed=${{ steps.init.outputs.replayed }}"
