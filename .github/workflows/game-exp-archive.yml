name: game-exp trusted archive
run-name: game-exp:archive:${{ inputs.request_id }}

concurrency:
  group: game-exp-archive-${{ inputs.request_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: Canonical experiment id, e.g. EXP-21
        required: true
        type: string
      request_id:
        description: Stable cross-interface operation id
        required: true
        type: string
      mode:
        description: Archive ref policy
        required: true
        type: choice
        default: ATOMIC_DELETE
        options:
          - ATOMIC_DELETE
          - RETAIN_BRANCH

jobs:
  dedupe:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      primary: ${{ steps.guard.outputs.primary }}
      primary_run_id: ${{ steps.guard.outputs.primary_run_id }}
      actor_login: ${{ steps.guard.outputs.actor_login }}
    steps:
      - name: Checkout request-id guard
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: control-guard
          sparse-checkout: |
            tools/game-exp/workflow_guard.py
            tools/game-exp/protocol_core.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select the first run for this request id
        id: guard
        env:
          GAME_EXP_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python control-guard/tools/game-exp/workflow_guard.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "game-exp-archive.yml" \
            --action "archive" \
            --request-id "${{ inputs.request_id }}" \
            --run-id "${{ github.run_id }}" \
            --experiment-id "${{ inputs.experiment_id }}" \
            --argument "mode=${{ inputs.mode }}" \
            --github-output "$GITHUB_OUTPUT"

  archive:
    needs: dedupe
    if: needs.dedupe.outputs.primary == 'true'
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted Archive control only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/game-exp/archive_control.py
            tools/game-exp/archive_runner.py
            tools/game-exp/trusted_writer.py
            tools/game-exp/domain_core.py
            tools/game-exp/protocol_core.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Require trusted writer key
        shell: bash
        env:
          WRITER_KEY: ${{ secrets.GAME_EXP_WRITER_KEY }}
        run: |
          set -euo pipefail
          test -n "$WRITER_KEY"
          key="$RUNNER_TEMP/game-exp-writer"
          printf '%s\n' "$WRITER_KEY" > "$key"
          chmod 600 "$key"
          echo "GAME_EXP_WRITER_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Run recoverable trusted Archive
        shell: bash
        env:
          GAME_EXP_GITHUB_TOKEN: ${{ github.token }}
          GAME_EXP_ACTOR_LOGIN: ${{ needs.dedupe.outputs.actor_login }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python tools/game-exp/archive_runner.py             --repo "$GITHUB_REPOSITORY"             --experiment-id "$EXPERIMENT_ID"             --mode "$MODE"             --ssh-key "$GAME_EXP_WRITER_KEY_PATH"             --run-id "$RUN_ID"             --run-attempt "$RUN_ATTEMPT"             --workflow-source-sha "$WORKFLOW_SOURCE_SHA"             --actor-login "$GAME_EXP_ACTOR_LOGIN"             | tee "$RUNNER_TEMP/archive-result.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-exp-archive-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/archive-result.json
          retention-days: 30
          if-no-files-found: warn
